<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141413"/>
    </marker>
    <marker id="ah2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0aea5"/>
    </marker>
  </defs>

  <!-- operator boxes -->
  <g stroke="#141413" stroke-width="1" fill="#faf9f5">
    <rect x="50" y="36" width="150" height="52" rx="6"/>
    <rect x="400" y="36" width="150" height="52" rx="6"/>
    <rect x="560" y="140" width="150" height="52" rx="6"/>
    <rect x="40" y="140" width="150" height="52" rx="6"/>
    <rect x="300" y="240" width="170" height="48" rx="6"/>
  </g>
  <g font-size="12" fill="#141413" text-anchor="middle">
    <text x="125" y="57" font-weight="600">解题 Solve</text>
    <text x="125" y="74" font-size="10" fill="#5e5d59">只用知识库作答</text>
    <text x="475" y="57" font-weight="600">发现 Discover</text>
    <text x="475" y="74" font-size="10" fill="#5e5d59">错题与意外 → 新主张</text>
    <text x="635" y="161" font-weight="600">核验 Verify</text>
    <text x="635" y="178" font-size="10" fill="#5e5d59">新题上程序裁决 + 统计门槛</text>
    <text x="115" y="161" font-weight="600">总结 Synthesize</text>
    <text x="115" y="178" font-size="10" fill="#5e5d59">合并 · 晋升 L1→L2→L3</text>
    <text x="385" y="260" font-weight="600">出题 Propose</text>
    <text x="385" y="276" font-size="10" fill="#5e5d59">随机 / 补证据 / 区分竞争理论</text>
  </g>

  <!-- claim store -->
  <rect x="300" y="118" width="170" height="66" rx="8" fill="#ffffff" stroke="#d97757" stroke-width="1.4"/>
  <text x="385" y="140" font-size="12" font-weight="600" fill="#d97757" text-anchor="middle">知识库 K（主张库）</text>
  <text x="385" y="157" font-size="10" fill="#5e5d59" text-anchor="middle">L1 → L2 → L3 · 状态 · 谱系 · 信用</text>
  <text x="385" y="172" font-size="10" fill="#5e5d59" text-anchor="middle">反例与证伪记录永久保留</text>

  <!-- main chain -->
  <line x1="200" y1="62" x2="396" y2="62" stroke="#141413" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="298" y="54" font-size="10" fill="#5e5d59" text-anchor="middle">看到错题与意外</text>
  <line x1="500" y1="88" x2="610" y2="136" stroke="#141413" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="575" y="106" font-size="10" fill="#5e5d59">主张（先预注册）</text>
  <path d="M 560,178 H 196" fill="none" stroke="#141413" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="378" y="196" font-size="10" fill="#5e5d59" text-anchor="middle">验证 / 证伪 / 收窄</text>
  <line x1="90" y1="192" x2="300" y2="252" stroke="#141413" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="165" y="206" font-size="10" fill="#5e5d59">合并后的知识库</text>
  <path d="M 300,264 H 24 V 62 H 44" fill="none" stroke="#141413" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="18" y="240" font-size="10" fill="#5e5d59" transform="rotate(-90 18 240)" text-anchor="middle">下一批题目</text>

  <!-- K interactions -->
  <line x1="330" y1="118" x2="180" y2="92" stroke="#b0aea5" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah2g)"/>
  <text x="238" y="98" font-size="9.5" fill="#b0aea5">读取</text>
  <line x1="560" y1="152" x2="474" y2="150" stroke="#b0aea5" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah2g)"/>
  <text x="500" y="142" font-size="9.5" fill="#b0aea5">更新状态</text>
  <line x1="190" y1="152" x2="296" y2="150" stroke="#b0aea5" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah2g)"/>
  <text x="216" y="142" font-size="9.5" fill="#b0aea5">改写</text>

  <!-- discipline -->
  <text x="40" y="316" font-size="10" fill="#5e5d59">纪律：预注册（先提交预测再跑实验）· 新题新鲜性（只用注册后生成的题核验）· 封存测试集（看一次即降为开发集）· 证据不删除（证伪也入账）</text>
</svg>
