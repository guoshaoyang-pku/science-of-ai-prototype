<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0aea5"/>
    </marker>
  </defs>

  <!-- L3 -->
  <rect x="24" y="8" width="520" height="104" rx="8" fill="#e8e6dc" stroke="#b0aea5" stroke-width="1"/>
  <text x="40" y="30" font-size="14" font-weight="600" fill="#141413">L3 科学（边界从原理推出）</text>
  <text x="40" y="50" font-size="10.5" fill="#5e5d59">判据：从可独立检验的前提推出关系为何成立；边界 = 前提失效处；单条条件推导即可。</text>
  <text x="40" y="65" font-size="10.5" fill="#5e5d59">分开两问：推导在假设内是否正确；前提在真实系统中是否成立（靠实验）</text>
  <text x="40" y="86" font-size="10" fill="#141413">支撑工作：Hyperball（2026，尺度不变性推导）· NTK（Jacot 2018）· lazy/rich 训练（Chizat 2019）</text>
  <text x="40" y="101" font-size="10" fill="#141413">· 缩放律的统计力学解释（Bahri 2023）· MDP（马尔可夫决策过程）/ Bellman 理论</text>

  <!-- L2 -->
  <rect x="24" y="152" width="520" height="104" rx="8" fill="#faf9f5" stroke="#b0aea5" stroke-width="1"/>
  <text x="40" y="174" font-size="14" font-weight="600" fill="#141413">L2 定律（边界靠系统扩展测出）</text>
  <text x="40" y="194" font-size="10.5" fill="#5e5d59">判据：沿声明的条件轴系统扩展、尽量解除约束后仍保留的稳定关系；</text>
  <text x="40" y="209" font-size="10.5" fill="#5e5d59">边界由观测到的失败定位，预算用完不等于到头；越界外推是新的待检主张</text>
  <text x="40" y="230" font-size="10" fill="#141413">支撑工作：Kaplan 2020 缩放律 · Chinchilla 2022 · 数据受限缩放 2023 · μP（最大更新参数化）·</text>
  <text x="40" y="245" font-size="10" fill="#141413">零样本迁移 2022 · 双下降 2019 · grokking 2022 · 奖励过优化定律 2022 · 有效时间 U（本工作）</text>

  <!-- L1 -->
  <rect x="24" y="296" width="520" height="104" rx="8" fill="#ffffff" stroke="#b0aea5" stroke-width="1"/>
  <text x="40" y="318" font-size="14" font-weight="600" fill="#141413">L1 知识（边界只在测过的点上观察到）</text>
  <text x="40" y="338" font-size="10.5" fill="#5e5d59">判据：在一个或少数具体设定下观察到的现象；外延尚未展开，</text>
  <text x="40" y="353" font-size="10.5" fill="#5e5d59">未测设定记为未知，不算成立</text>
  <text x="40" y="374" font-size="10" fill="#141413">支撑工作：GRPO（DeepSeekMath 2024）· GSPO（序列级裁剪）2025 · FlashAttention 2022 · LoRA 2021 ·</text>
  <text x="40" y="389" font-size="10" fill="#141413">Megatron-LM（分布式训练）2019 · ExpeL 2023 · Voyager 2023 · 绝大多数 RL / 系统论文</text>

  <!-- promote arrows -->
  <line x1="264" y1="292" x2="264" y2="262" stroke="#d97757" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="276" y="276" font-size="10.5" fill="#d97757" font-style="italic">晋升：沿条件轴扩展外延，记录支持 / 失败 / 未测</text>
  <line x1="264" y1="148" x2="264" y2="118" stroke="#d97757" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="276" y="132" font-size="10.5" fill="#d97757" font-style="italic">晋升：找到可独立检验的前提，推出关系与边界</text>

  <!-- demote bows -->
  <path d="M 28,116 C 6,132 6,136 28,150" fill="none" stroke="#b0aea5" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ahg)"/>
  <path d="M 28,260 C 6,276 6,280 28,294" fill="none" stroke="#b0aea5" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ahg)"/>
  <text x="14" y="230" font-size="10" fill="#b0aea5" transform="rotate(-90 14 230)" text-anchor="middle">降级：声明域内出现反例则收窄或撤回</text>

  <!-- side note -->
  <text x="560" y="24" font-size="10.5" font-weight="600" fill="#141413">分开记录三件事</text>
  <text x="560" y="46" font-size="10.5" fill="#5e5d59">层次：边界怎样得知</text>
  <text x="560" y="64" font-size="10.5" fill="#5e5d59">Scope：适用范围多大，</text>
  <text x="560" y="80" font-size="10.5" fill="#5e5d59">即不适用测度 u</text>
  <text x="560" y="98" font-size="10.5" fill="#5e5d59">证据协议：坐标多可信</text>
  <text x="560" y="130" font-size="10.5" fill="#5e5d59">窄域推导可以是科学，</text>
  <text x="560" y="146" font-size="10.5" fill="#5e5d59">广域经验关系仍是定律。</text>
  <text x="560" y="178" font-size="10.5" fill="#5e5d59">预注册、盲测、程序裁决、</text>
  <text x="560" y="194" font-size="10.5" fill="#5e5d59">机器可读提高可信度，</text>
  <text x="560" y="210" font-size="10.5" fill="#5e5d59">但不决定层次。</text>
  <text x="560" y="320" font-size="10.5" fill="#5e5d59">三层分类的对象是</text>
  <text x="560" y="336" font-size="10.5" fill="#5e5d59">「主张」，不是期刊、</text>
  <text x="560" y="352" font-size="10.5" fill="#5e5d59">作者或系统：一篇论文</text>
  <text x="560" y="368" font-size="10.5" fill="#5e5d59">可以同时含三层的主张。</text>
  <text x="560" y="392" font-size="10.5" fill="#5e5d59">层次不是价值排名：广、</text>
  <text x="560" y="408" font-size="10.5" fill="#5e5d59">准、便宜的定律可能比</text>
  <text x="560" y="424" font-size="10.5" fill="#5e5d59">窄域科学更有用。</text>
</svg>
