  <!-- benchmark strip -->
  <rect x="40" y="388" width="690" height="28" rx="6" fill="none" stroke="#d97757" stroke-dasharray="5 4"/>
  <text x="385" y="406" font-size="9.5" fill="#d97757" text-anchor="middle">基准与评测：MLE-bench · RE-Bench · PaperBench · DSBench · MLGym · SWE-bench · METR · ArchitectureIQ —— 所列基准只测 level-1 的任务表现</text>
