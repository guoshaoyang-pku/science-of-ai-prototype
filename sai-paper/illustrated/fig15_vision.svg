<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="前景：从“凭直觉挑、跑了才知道”，到“查了、算了就知道”"><title>前景：从“凭直觉挑、跑了才知道”，到“查了、算了就知道”</title><defs><marker id="fig15-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig15-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig15-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig15-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig15-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig15-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig15-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="489" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">前景：从“凭直觉挑、跑了才知道”，到“查了、算了就知道”</text><text x="32" y="66" font-size="13" fill="#5E5D59">主张库越大、边界越清楚，落在声明域内、不必重跑的问题就越多；原点是方向，不是已经到达的终点</text><text x="30" y="104" font-size="14" fill="#141413" font-weight="700">今天：凭直觉挑，跑了才知道</text><rect x="50" y="120" width="180" height="40" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="140" y="145" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">新问题</text><line x1="140" y1="162" x2="140" y2="179" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig15-ar-muted)" class="nt"/><rect x="50" y="184" width="180" height="48" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="140" y="204" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">凭直觉挑候选</text><text x="140" y="222" font-size="12" fill="#5E5D59" text-anchor="middle">准不准、哪里不灵，说不清</text><line x1="140" y1="234" x2="140" y2="251" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig15-ar-muted)" class="nt"/><rect x="50" y="256" width="180" height="48" fill="#3D3D3A" rx="10" class="card"/><text x="140" y="276" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">把训练跑完</text><text x="140" y="294" font-size="12.5" fill="#FFFFFF" text-anchor="middle">c = 1</text><line x1="140" y1="306" x2="140" y2="323" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig15-ar-muted)" class="nt"/><rect x="50" y="328" width="180" height="40" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="140" y="353" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">得到这一个结果</text><path d="M50 348 C20 348 20 140 46 140" fill="none" stroke="#5E5D59" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#fig15-ar-muted)" class="nt"/><text x="140" y="390" font-size="12.5" fill="#5E5D59" text-anchor="middle">下一个问题，再挑、再跑</text><line x1="270" y1="92" x2="270" y2="380" stroke="#E8E6DC" stroke-width="1.2" stroke-linecap="round"/><text x="290" y="104" font-size="14" fill="#141413" font-weight="700">SAI：先查主张，再决定跑不跑</text><rect x="300" y="122" width="130" height="44" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="365" y="149" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">新问题</text><line x1="434" y1="144" x2="466" y2="145" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig15-ar-ink)" class="nt"/><path d="M470 146L566 102L662 146L566 190Z" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="142" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">落在某条主张的</text><text x="566" y="160" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">声明域 D<tspan dy="3.9" font-size="9.36">M</tspan><tspan dy="-3.9"> 内？</tspan></text><line x1="662" y1="146" x2="700" y2="146" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig15-ar-ink)" class="nt"/><text x="680" y="138" font-size="12" fill="#5E5D59" font-weight="700" text-anchor="middle">是</text><rect x="704" y="120" width="150" height="52" fill="#F7E3D8" rx="10" stroke="#D97757" stroke-width="1.5" class="card"/><text x="779" y="142" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">直接作答</text><text x="779" y="161" font-size="12" fill="#5E5D59" text-anchor="middle">c 很小，误差 e 已知</text><line x1="566" y1="190" x2="566" y2="225" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig15-ar-ink)" class="nt"/><text x="578" y="212" font-size="12" fill="#5E5D59" font-weight="700">否</text><rect x="476" y="230" width="180" height="52" fill="#3D3D3A" rx="10" class="card"/><text x="566" y="252" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">回退：把训练跑完</text><text x="566" y="271" font-size="12" fill="#FFFFFF" text-anchor="middle">c = 1，得到真值</text><line x1="566" y1="284" x2="566" y2="315" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig15-ar-ink)" class="nt"/><rect x="436" y="320" width="260" height="60" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="566" y="343" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">新结果回流</text><text x="566" y="363" font-size="12" fill="#5E5D59" text-anchor="middle">扩展外延、找到前提：知识 → 定律 → 科学</text><rect x="300" y="230" width="140" height="52" fill="#F3F1EA" rx="10" stroke="#D97757" stroke-width="1.5" class="card"/><text x="370" y="252" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">主张库</text><text x="370" y="271" font-size="12" fill="#5E5D59" text-anchor="middle">主张 + 声明域 + 坐标</text><line x1="420" y1="228" x2="514" y2="170" stroke="#D97757" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#fig15-ar-clay)" class="nt"/><text x="452" y="186" font-size="12" fill="#A8492C" font-weight="700" text-anchor="end">查询</text><path d="M436 350H370V287" fill="none" stroke="#D97757" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fig15-ar-clay)" class="nt"/><text x="378" y="330" font-size="12" fill="#A8492C" font-weight="700">更新</text><line x1="30" y1="400" x2="850" y2="400" stroke="#E8E6DC" stroke-width="1" stroke-linecap="round"/><text x="30" y="426" font-size="13" fill="#141413" font-weight="700">长期（示意）：同样多的问题里，不必重跑就能作答的比例上升</text><text x="30" y="452" font-size="12.5" fill="#5E5D59">今天</text><rect x="70" y="442" width="40.6" height="12" fill="#EFC1A8" rx="3"/><rect x="112.6" y="442" width="477.4" height="12" fill="#3D3D3A" rx="3"/><text x="30" y="474" font-size="12.5" fill="#5E5D59">方向</text><rect x="70" y="464" width="415" height="12" fill="#EFC1A8" rx="3"/><rect x="487" y="464" width="103" height="12" fill="#3D3D3A" rx="3"/><rect x="620" y="441" width="16" height="14" fill="#EFC1A8" rx="2"/><text x="642" y="452" font-size="12.5" fill="#3D3D3A">落在声明域内：直接作答</text><rect x="620" y="463" width="16" height="14" fill="#3D3D3A" rx="2"/><text x="642" y="474" font-size="12.5" fill="#3D3D3A">回退：把训练跑完</text></svg>
