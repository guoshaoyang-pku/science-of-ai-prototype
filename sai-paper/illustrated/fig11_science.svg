<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="科学：从可独立检验的前提，推出关系和它的边界"><title>科学：从可独立检验的前提，推出关系和它的边界</title><defs><marker id="fig11-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig11-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig11-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig11-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig11-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig11-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig11-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern><clipPath id="fig11-clipR"><rect x="450" y="96" width="400" height="300" rx="10"/></clipPath></defs><rect x="0.5" y="0.5" width="879" height="515" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">科学：从可独立检验的前提，推出关系和它的边界</text><text x="32" y="66" font-size="13" fill="#5E5D59">要分开问两件事：推导在假设内对不对（数学问题）；前提在真实系统里成不成立（映射问题，要用实验检验）</text><text x="30" y="104" font-size="13.5" fill="#141413" font-weight="700">“第一性原理”的可操作含义：前提满足三条</text><rect x="30" y="116" width="390" height="52" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="46" y="138" font-size="14" fill="#141413" font-weight="700">(a) 显式写出</text><text x="46" y="158" font-size="12.5" fill="#5E5D59">每条前提都写下来，而不是藏在拟合里</text><rect x="30" y="176" width="390" height="52" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="46" y="198" font-size="14" fill="#141413" font-weight="700">(b) 能独立于结论检验</text><text x="46" y="218" font-size="12.5" fill="#5E5D59">不能把拟合出的关系换个说法当作前提</text><rect x="30" y="236" width="390" height="52" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="46" y="258" font-size="14" fill="#141413" font-weight="700">(c) 结论由前提推出</text><text x="46" y="278" font-size="12.5" fill="#5E5D59">边界就是前提失效的地方</text><line x1="225" y1="292" x2="225" y2="325" stroke="#2E6CAB" stroke-width="2" stroke-linecap="round" marker-end="url(#fig11-ar-blue)" class="nt"/><text x="240" y="314" font-size="12.5" fill="#245A93" font-weight="700">推导：在假设内对不对（数学问题）</text><rect x="30" y="330" width="390" height="52" fill="#DCE8F4" rx="10" stroke="#2E6CAB" stroke-width="1.4" class="card"/><text x="46" y="352" font-size="14" fill="#141413" font-weight="700">关系 R，以及它的边界</text><text x="46" y="372" font-size="12.5" fill="#5E5D59">边界 = 前提失效的地方</text><rect x="30" y="392" width="390" height="52" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="46" y="414" font-size="13.5" fill="#141413" font-weight="700">映射问题：前提在真实系统中成立吗？</text><text x="46" y="434" font-size="12.5" fill="#5E5D59">要像定律一样，用实验逐条检验</text><rect x="30" y="454" width="390" height="40" fill="#FFFFFF" rx="10" stroke="#A3291F" stroke-width="1.2" stroke-dasharray="5 4" class="card"/><path d="M45 469L55 479M55 469L45 479" fill="none" stroke="#A3291F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="nt"/><text x="64" y="479" font-size="12.5" fill="#A3291F">循环论证：把拟合出的关系换个说法当前提，违反 (b)</text><rect x="450" y="96" width="400" height="300" fill="url(#fig11-hatch)" rx="10" stroke="#DAD6CB" stroke-width="1"/><path d="M490 250 A150 112 0 1 0 790 250 A150 112 0 1 0 490 250 Z" fill="#FAF9F5" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 250 A150 112 0 1 0 790 250 A150 112 0 1 0 490 250 Z" fill="none" stroke="#3D3D3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" class="nt"/><path d="M514 262 A98 72 0 1 0 710 262 A98 72 0 1 0 514 262 Z" fill="#F7E3D8" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M514 262 A98 72 0 1 0 710 262 A98 72 0 1 0 514 262 Z" fill="none" stroke="#2E6CAB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="nt"/><rect x="552" y="116.24" width="176" height="15.84" fill="#FAF9F5" rx="3" opacity="0.94"/><text x="640" y="128" font-size="12" fill="#5E5D59" text-anchor="middle">真实成立的范围（未知，示意）</text><text x="612" y="226" font-size="12" fill="#245A93" font-weight="700" text-anchor="middle">推出的范围（前提已核验）</text><circle cx="590" cy="270" r="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="2"/><text x="590" y="274.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><circle cx="742" cy="220" r="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="2"/><text x="742" y="224.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><circle cx="812" cy="352" r="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="2"/><text x="812" y="356.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><circle cx="464" cy="418" r="9" fill="#3D3D3A"/><text x="464" y="422" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="482" y="422" font-size="12.5" fill="#3D3D3A">前提已核验：没测过结果，也能作答</text><circle cx="464" cy="442" r="9" fill="#3D3D3A"/><text x="464" y="446" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="482" y="446" font-size="12.5" fill="#3D3D3A">其实成立，但推导不保证：记为未知</text><circle cx="464" cy="466" r="9" fill="#3D3D3A"/><text x="464" y="470" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="482" y="470" font-size="12.5" fill="#3D3D3A">不成立</text><text x="456" y="496" font-size="12" fill="#5E5D59">推导只给充分条件时，推出的边界是内界：界外是未知，不是已证失效</text></svg>
