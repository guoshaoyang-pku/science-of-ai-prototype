<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="晋升、降级，以及哪些东西不构成层次依据"><title>晋升、降级，以及哪些东西不构成层次依据</title><defs><marker id="fig12-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig12-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig12-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig12-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig12-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig12-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig12-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="469" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">晋升、降级，以及哪些东西不构成层次依据</text><rect x="40" y="96" width="160" height="64" fill="#FFFFFF" rx="12" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="120" y="124" font-size="18" fill="#141413" font-weight="700" text-anchor="middle">知识</text><text x="120" y="146" font-size="12.5" fill="#5E5D59" text-anchor="middle">边界：观察到</text><rect x="360" y="96" width="160" height="64" fill="#FFFFFF" rx="12" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="440" y="124" font-size="18" fill="#141413" font-weight="700" text-anchor="middle">定律</text><text x="440" y="146" font-size="12.5" fill="#5E5D59" text-anchor="middle">边界：系统扩展测出</text><rect x="680" y="96" width="160" height="64" fill="#FFFFFF" rx="12" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="760" y="124" font-size="18" fill="#141413" font-weight="700" text-anchor="middle">科学</text><text x="760" y="146" font-size="12.5" fill="#5E5D59" text-anchor="middle">边界：从前提推出</text><line x1="206" y1="128" x2="354" y2="128" stroke="#D97757" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fig12-ar-clay)" class="nt"/><text x="280" y="104" font-size="12" fill="#A8492C" font-weight="700" text-anchor="middle">沿条件轴扩展外延，</text><text x="280" y="119" font-size="12" fill="#A8492C" text-anchor="middle">记录支持、失败和未测</text><line x1="526" y1="128" x2="674" y2="128" stroke="#D97757" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fig12-ar-clay)" class="nt"/><text x="600" y="104" font-size="12" fill="#A8492C" font-weight="700" text-anchor="middle">找到可独立检验的前提，</text><text x="600" y="119" font-size="12" fill="#A8492C" text-anchor="middle">推出关系与边界</text><text x="40" y="206" font-size="13" fill="#5E5D59" font-weight="700">出现反例时</text><rect x="40" y="222" width="170" height="56" fill="#FFFFFF" rx="10" stroke="#A3291F" stroke-width="1.4" class="card"/><text x="125" y="245" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">声明域内出现反例</text><text x="125" y="265" font-size="12" fill="#5E5D59" text-anchor="middle">证伪记录保留</text><line x1="214" y1="250" x2="250" y2="250" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig12-ar-ink)" class="nt"/><rect x="254" y="222" width="180" height="56" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="344" y="245" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">先收窄声明域 D<tspan dy="3.9" font-size="9.36">M</tspan></text><text x="344" y="265" font-size="12" fill="#5E5D59" text-anchor="middle">误差 e 随之降低</text><line x1="438" y1="250" x2="470" y2="250" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig12-ar-ink)" class="nt"/><path d="M474 250L556 204L638 250L556 296Z" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="246" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">收窄后还满足</text><text x="556" y="264" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">本层的依据吗？</text><line x1="638" y1="250" x2="690" y2="216" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig12-ar-ink)" class="nt"/><line x1="638" y1="250" x2="690" y2="288" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig12-ar-ink)" class="nt"/><text x="654" y="226" font-size="12" fill="#5E5D59" font-weight="700">是</text><text x="654" y="286" font-size="12" fill="#5E5D59" font-weight="700">否</text><rect x="694" y="190" width="160" height="48" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="774" y="211" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">满足：留在本层</text><text x="774" y="229" font-size="12" fill="#5E5D59" text-anchor="middle">范围更小</text><rect x="694" y="266" width="160" height="48" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="774" y="287" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">不满足：降一层</text><text x="774" y="305" font-size="12" fill="#5E5D59" text-anchor="middle">证伪记录保留</text><line x1="40" y1="346" x2="840" y2="346" stroke="#E8E6DC" stroke-width="1" stroke-linecap="round"/><text x="40" y="376" font-size="13" fill="#141413" font-weight="700">不构成层次依据，也不自动升层（它们记入证据协议）：</text><rect x="40" y="390" width="72" height="26" fill="#F3F1EA" rx="13" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="76" y="407.5" font-size="12.5" fill="#141413" text-anchor="middle">形式定义</text><rect x="122" y="390" width="84.5" height="26" fill="#F3F1EA" rx="13" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="164.25" y="407.5" font-size="12.5" fill="#141413" text-anchor="middle">程序可执行</text><rect x="216.5" y="390" width="72" height="26" fill="#F3F1EA" rx="13" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="252.5" y="407.5" font-size="12.5" fill="#141413" text-anchor="middle">一次验证</text><rect x="298.5" y="390" width="47" height="26" fill="#F3F1EA" rx="13" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="322" y="407.5" font-size="12.5" fill="#141413" text-anchor="middle">高分</text><rect x="355.5" y="390" width="59.5" height="26" fill="#F3F1EA" rx="13" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="385.25" y="407.5" font-size="12.5" fill="#141413" text-anchor="middle">预注册</text><rect x="425" y="390" width="47" height="26" fill="#F3F1EA" rx="13" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="448.5" y="407.5" font-size="12.5" fill="#141413" text-anchor="middle">盲测</text><rect x="482" y="390" width="72" height="26" fill="#F3F1EA" rx="13" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="518" y="407.5" font-size="12.5" fill="#141413" text-anchor="middle">机器可读</text><text x="40" y="444" font-size="12.5" fill="#5E5D59">它们说明坐标有多可信，不说明边界是怎么知道的。</text></svg>
