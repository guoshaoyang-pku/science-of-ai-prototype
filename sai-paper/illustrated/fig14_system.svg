<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="SAI 系统：自动产出主张的系统，评价看三件事"><title>SAI 系统：自动产出主张的系统，评价看三件事</title><defs><marker id="fig14-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig14-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig14-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig14-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig14-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig14-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig14-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="439" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">SAI 系统：自动产出主张的系统，评价看三件事</text><text x="32" y="66" font-size="13" fill="#5E5D59">里程碑 M0–M6 是对系统的另一种评分，不是主张的层次</text><rect x="30" y="104" width="170" height="64" fill="#3D3D3A" rx="12" class="card"/><text x="115" y="132" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">SAI 系统</text><text x="115" y="154" font-size="12.5" fill="#FFFFFF" text-anchor="middle">自动产出主张</text><line x1="115" y1="172" x2="115" y2="203" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig14-ar-muted)" class="nt"/><rect x="52" y="220" width="150" height="44" fill="#FFFFFF" rx="8" stroke="#DAD6CB" stroke-width="1"/><rect x="46" y="214" width="150" height="44" fill="#FFFFFF" rx="8" stroke="#DAD6CB" stroke-width="1"/><rect x="40" y="208" width="150" height="44" fill="#FFFFFF" rx="8" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="54" y="227" font-size="12.5" fill="#141413" font-weight="700">主张 + 声明域</text><text x="54" y="244" font-size="12" fill="#5E5D59">坐标 (e, c, u)</text><line x1="206" y1="236" x2="268" y2="236" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig14-ar-muted)" class="nt"/><path d="M305.8 110L305.8 218L323.2 218L323.2 304.4L358 304.4L358 347.6L421.8 347.6L421.8 369.2L590 369.2L590 373.52L590 373.52L590 353L517.5 353L517.5 315.2L445 315.2L445 245L372.5 245L372.5 131.6L323.2 131.6L323.2 110Z" fill="#D97757" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.12"/><path d="M323.2 110V131.6H372.5V245H445V315.2H517.5V353H590V373.52" fill="none" stroke="#B9B5AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nt"/><path d="M305.8 110V218H323.2V304.4H358V347.6H421.8V369.2H590V373.52" fill="none" stroke="#D97757" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="nt"/><line x1="300" y1="380" x2="604" y2="380" stroke="#3D3D3A" stroke-width="1.3" stroke-linecap="round" marker-end="url(#fig14-ar-ink)" class="nt"/><line x1="300" y1="380" x2="300" y2="98" stroke="#3D3D3A" stroke-width="1.3" stroke-linecap="round" marker-end="url(#fig14-ar-ink)" class="nt"/><text x="310" y="104" font-size="12.5" fill="#5E5D59" font-weight="700">误差 e</text><text x="445" y="400" font-size="12.5" fill="#5E5D59" font-weight="700" text-anchor="middle">代价 c</text><circle cx="300" cy="380" r="6" fill="#FAF9F5" stroke="#D97757" stroke-width="2.4" class="nt"/><circle cx="300" cy="380" r="2.4" fill="#D97757" class="nt"/><circle cx="590" cy="373.52" r="6" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="2" class="nt"/><text x="600" y="400" font-size="12.5" fill="#141413" font-weight="700" text-anchor="end">直接训练</text><text x="453" y="239" font-size="12.5" fill="#5E5D59" font-weight="700">旧前沿</text><text x="314" y="338" font-size="12.5" fill="#A8492C" font-weight="700">新前沿</text><text x="380" y="340" font-size="12.5" fill="#A8492C" font-weight="700">前沿推进</text><text x="300" y="424" font-size="12" fill="#5E5D59">u 已按“回退到直接训练”折算进 e 和 c</text><rect x="620" y="96" width="236" height="92" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="636" y="122" font-size="14" fill="#141413" font-weight="700">前沿推进</text><text x="636" y="146" font-size="12.5" fill="#5E5D59">同一份合同下，产出的主张把</text><text x="636" y="165" font-size="12.5" fill="#5E5D59">(e, c, u) 前沿向原点推了多少</text><rect x="620" y="198" width="236" height="112" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="636" y="224" font-size="14" fill="#141413" font-weight="700">生产代价</text><text x="636" y="248" font-size="12.5" fill="#5E5D59">产出主张花的计算，和使用代价</text><text x="636" y="267" font-size="12.5" fill="#5E5D59">c 分开记：花 10<tspan dy="-5" font-size="9">6</tspan><tspan dy="5"> GPU 小时</tspan></text><text x="636" y="286" font-size="12.5" fill="#5E5D59">拟合出的定律，用起来可以很便宜</text><rect x="620" y="320" width="236" height="92" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="636" y="346" font-size="14" fill="#141413" font-weight="700">划界诚实度</text><text x="636" y="370" font-size="12.5" fill="#5E5D59">声明域里实际出错的比例，</text><text x="636" y="389" font-size="12.5" fill="#5E5D59">即越界声明（overclaim）率</text></svg>
