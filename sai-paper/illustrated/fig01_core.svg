<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="SAI 的核心：衡量科学家的直觉"><title>SAI 的核心：衡量科学家的直觉</title><defs><marker id="fig01-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig01-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig01-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig01-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig01-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig01-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig01-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="459" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">SAI 的核心：衡量科学家的直觉</text><text x="32" y="66" font-size="13" fill="#5E5D59">直觉是不把实验跑完就判断结果的能力。SAI 定量衡量它，并研究它怎样变成写明成立范围的知识</text><rect x="30" y="92" width="210" height="340" fill="#FFFFFF" rx="12" stroke="#D97757" stroke-width="1.6" class="card"/><text x="48" y="122" font-size="16" fill="#141413" font-weight="700">科学家的直觉</text><text x="48" y="142" font-size="12" fill="#6F6D66">人，或者模型</text><text x="48" y="170" font-size="13" fill="#141413">不把实验跑完，</text><text x="48" y="189" font-size="13" fill="#141413">就判断结果会怎样</text><rect x="48" y="210" width="72" height="40" fill="#F3F1EA" rx="8" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="84" y="235" font-size="12.5" fill="#141413" text-anchor="middle">配置 A</text><rect x="150" y="210" width="72" height="40" fill="#F3F1EA" rx="8" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="186" y="235" font-size="12.5" fill="#141413" text-anchor="middle">配置 B</text><text x="135" y="276" font-size="12.5" fill="#3D3D3A" font-weight="700" text-anchor="middle">判断：A 的最终损失更低</text><text x="48" y="318" font-size="12.5" fill="#6F6D66" font-weight="700">代价</text><text x="84" y="318" font-size="12.5" fill="#3D3D3A">近 0，不用跑</text><text x="48" y="344" font-size="12.5" fill="#6F6D66" font-weight="700">误差</text><text x="84" y="344" font-size="12.5" fill="#3D3D3A">多大？</text><text x="48" y="370" font-size="12.5" fill="#6F6D66" font-weight="700">边界</text><text x="84" y="370" font-size="12.5" fill="#3D3D3A">在哪里不灵？</text><text x="48" y="404" font-size="12" fill="#A8492C" font-weight="700">后两个问号，就是 SAI 要回答的</text><line x1="244" y1="173" x2="273" y2="173" stroke="#D97757" stroke-width="2" stroke-linecap="round" marker-end="url(#fig01-ar-clay)" class="nt"/><line x1="244" y1="349" x2="273" y2="349" stroke="#3D3D3A" stroke-width="2" stroke-linecap="round" marker-end="url(#fig01-ar-ink)" class="nt"/><rect x="278" y="92" width="572" height="162" fill="#F3F1EA" rx="12" class="card"/><rect x="296" y="106" width="150" height="24" fill="#D97757" rx="12" class="card"/><text x="371" y="122.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">定量判据（目前唯一）</text><text x="458" y="124" font-size="15" fill="#141413" font-weight="700">衡量：这份直觉值多少训练算力</text><line x1="300" y1="226" x2="506" y2="226" stroke="#3D3D3A" stroke-width="1.2" stroke-linecap="round" marker-end="url(#fig01-ar-ink)" class="nt"/><line x1="300" y1="226" x2="300" y2="144" stroke="#3D3D3A" stroke-width="1.2" stroke-linecap="round" marker-end="url(#fig01-ar-ink)" class="nt"/><path d="M300 226L301.63 224.58L303.27 223.19L304.9 221.83L306.53 220.49L308.17 219.18L309.8 217.9L311.43 216.64L313.07 215.41L314.7 214.2L316.33 213.01L317.97 211.85L319.6 210.71L321.23 209.59L322.87 208.5L324.5 207.43L326.13 206.38L327.77 205.35L329.4 204.34L331.03 203.35L332.67 202.38L334.3 201.42L335.93 200.49L337.57 199.58L339.2 198.68L340.83 197.81L342.47 196.94L344.1 196.1L345.73 195.27L347.37 194.46L349 193.67L350.63 192.89L352.27 192.13L353.9 191.38L355.53 190.65L357.17 189.93L358.8 189.22L360.43 188.53L362.07 187.85L363.7 187.19L365.33 186.54L366.97 185.9L368.6 185.28L370.23 184.67L371.87 184.07L373.5 183.48L375.13 182.9L376.77 182.33L378.4 181.78L380.03 181.24L381.67 180.7L383.3 180.18L384.93 179.67L386.57 179.17L388.2 178.68L389.83 178.2L391.47 177.72L393.1 177.26L394.73 176.81L396.37 176.36L398 175.93L399.63 175.5L401.27 175.08L402.9 174.67L404.53 174.27L406.17 173.87L407.8 173.49L409.43 173.11L411.07 172.73L412.7 172.37L414.33 172.01L415.97 171.66L417.6 171.32L419.23 170.98L420.87 170.65L422.5 170.33L424.13 170.02L425.77 169.7L427.4 169.4L429.03 169.1L430.67 168.81L432.3 168.52L433.93 168.24L435.57 167.97L437.2 167.7L438.83 167.43L440.47 167.17L442.1 166.92L443.73 166.67L445.37 166.43L447 166.19L448.63 165.95L450.27 165.72L451.9 165.5L453.53 165.28L455.17 165.06L456.8 164.85L458.43 164.64L460.07 164.44L461.7 164.24L463.33 164.04L464.97 163.85L466.6 163.66L468.23 163.48L469.87 163.29L471.5 163.12L473.13 162.94L474.77 162.77L476.4 162.61L478.03 162.44L479.67 162.28L481.3 162.13L482.93 161.97L484.57 161.82L486.2 161.67L487.83 161.53L489.47 161.38L491.1 161.25L492.73 161.11L494.37 160.97L496 160.84" fill="none" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="nt"/><line x1="300" y1="167.37" x2="439.22" y2="167.37" stroke="#3D3D3A" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3" class="nt"/><line x1="439.22" y1="167.37" x2="439.22" y2="226" stroke="#3D3D3A" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3" class="nt"/><circle cx="439.22" cy="167.37" r="4.5" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="2" class="nt"/><text x="439.22" y="244" font-size="13.5" fill="#141413" font-weight="700" text-anchor="middle">ρ<tspan dy="-5.4" font-size="9.72">*</tspan></text><text x="306" y="162" font-size="11.5" fill="#3D3D3A">直觉的选对率</text><text x="372" y="214" font-size="11.5" fill="#3D3D3A">基线试探</text><text x="528" y="160" font-size="12.5" fill="#3D3D3A">1. 在一份合同下，测直觉的选对率（误差 e）</text><text x="528" y="184" font-size="12.5" fill="#3D3D3A">2. 看基线试探要花多少预算才能追平</text><text x="528" y="208" font-size="12.5" fill="#3D3D3A">3. 这个预算就是等价算力 ρ<tspan dy="-5" font-size="9">*</tspan></text><text x="528" y="236" font-size="12" fill="#6F6D66">panel 实测：最强的闭卷模型 ρ<tspan dy="-4.8" font-size="8.64">*</tspan><tspan dy="4.8"> ≈ 8.5%</tspan></text><rect x="278" y="266" width="572" height="166" fill="#FFFFFF" rx="12" stroke="#3D3D3A" stroke-width="1.6" class="card"/><rect x="296" y="280" width="112" height="24" fill="#3D3D3A" rx="12" class="card"/><text x="352" y="296.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">更多：研究对象</text><text x="420" y="298" font-size="15" fill="#141413" font-weight="700">知识怎样产生，在什么范围内成立</text><rect x="296" y="318" width="160" height="40" fill="#F3F1EA" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="312" y="343" font-size="14" fill="#141413" font-weight="700">知识</text><text x="354" y="343" font-size="12.5" fill="#5E5D59">观察到</text><line x1="460" y1="338" x2="482" y2="338" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig01-ar-muted)" class="nt"/><rect x="486" y="318" width="160" height="40" fill="#F3F1EA" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="502" y="343" font-size="14" fill="#141413" font-weight="700">定律</text><text x="544" y="343" font-size="12.5" fill="#5E5D59">测出来</text><line x1="650" y1="338" x2="672" y2="338" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig01-ar-muted)" class="nt"/><rect x="676" y="318" width="160" height="40" fill="#F3F1EA" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="692" y="343" font-size="14" fill="#141413" font-weight="700">科学</text><text x="734" y="343" font-size="12.5" fill="#5E5D59">推出来</text><text x="296" y="384" font-size="13" fill="#3D3D3A">成立范围：声明域 D<tspan dy="3.9" font-size="9.36">M</tspan><tspan dy="-3.9"> 内作答，界外声明不适用，记作 u</tspan></text><text x="296" y="408" font-size="12.5" fill="#5E5D59">知道边界在哪，界外就能回退到直接训练；不知道，就会在未知的地方出错</text></svg>
