<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 488" width="880" height="488" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="分开记录的四件事：各记各的，不互相推出"><title>分开记录的四件事：各记各的，不互相推出</title><defs><marker id="fig13-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig13-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig13-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig13-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig13-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig13-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig13-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="487" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">分开记录的四件事：各记各的，不互相推出</text><text x="32" y="66" font-size="13" fill="#5E5D59">四个例子的取值是示意。层次看依据的类型，Scope 看坐标，证据协议看坐标多可信，阅读层级看核查得多深</text><text x="220" y="106" font-size="14.5" fill="#141413" font-weight="700">层次</text><text x="220" y="126" font-size="12.5" fill="#5E5D59">边界是怎么知道的</text><text x="220" y="146" font-size="12" fill="#6F6D66">知识 · 定律 · 科学</text><text x="380" y="106" font-size="14.5" fill="#141413" font-weight="700">Scope</text><text x="380" y="126" font-size="12.5" fill="#5E5D59">适用范围多大</text><text x="380" y="146" font-size="12" fill="#6F6D66">合同下的 u 及其上界</text><text x="540" y="106" font-size="14.5" fill="#141413" font-weight="700">证据协议</text><text x="540" y="126" font-size="12.5" fill="#5E5D59">坐标有多可信</text><text x="540" y="146" font-size="12" fill="#6F6D66">预注册、盲测、复现、</text><text x="540" y="162" font-size="12" fill="#6F6D66">程序裁决、证明核查…</text><text x="700" y="106" font-size="14.5" fill="#141413" font-weight="700">阅读层级</text><text x="700" y="126" font-size="12.5" fill="#5E5D59">我们读到多深</text><text x="700" y="146" font-size="12" fill="#6F6D66">元数据 → 摘要 →</text><text x="700" y="162" font-size="12" fill="#6F6D66">指定章节 → 全文</text><line x1="30" y1="176" x2="850" y2="176" stroke="#DAD6CB" stroke-width="1" stroke-linecap="round"/><text x="30" y="212" font-size="13.5" fill="#141413" font-weight="700">窄域推导</text><text x="30" y="232" font-size="12" fill="#5E5D59">只在一小片条件上推出</text><rect x="220" y="198" width="52" height="26" fill="#3D3D3A" rx="13" class="card"/><text x="246" y="215.86" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">科学</text><rect x="380" y="204" width="120" height="12" fill="url(#fig13-hatch)" rx="3" stroke="#DAD6CB" stroke-width="1"/><rect x="380" y="204" width="18" height="12" fill="#EFC1A8" rx="3"/><text x="380" y="236" font-size="12.5" fill="#3D3D3A">窄：u ≈ 0.85</text><rect x="540" y="200" width="82" height="24" fill="#F3F1EA" rx="12" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="581" y="216.32" font-size="12" fill="#141413" text-anchor="middle">推导已核查</text><circle cx="706" cy="212" r="5" fill="#3D3D3A" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><circle cx="722" cy="212" r="5" fill="#3D3D3A" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><circle cx="738" cy="212" r="5" fill="#3D3D3A" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><circle cx="754" cy="212" r="5" fill="#3D3D3A" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><text x="772" y="217" font-size="12.5" fill="#3D3D3A">全文</text><line x1="30" y1="253" x2="850" y2="253" stroke="#E8E6DC" stroke-width="1" stroke-linecap="round"/><text x="30" y="284" font-size="13.5" fill="#141413" font-weight="700">广域经验关系</text><text x="30" y="304" font-size="12" fill="#5E5D59">覆盖很多条件的拟合</text><rect x="220" y="270" width="52" height="26" fill="#3D3D3A" rx="13" class="card"/><text x="246" y="287.86" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">定律</text><rect x="380" y="276" width="120" height="12" fill="url(#fig13-hatch)" rx="3" stroke="#DAD6CB" stroke-width="1"/><rect x="380" y="276" width="102" height="12" fill="#EFC1A8" rx="3"/><text x="380" y="308" font-size="12.5" fill="#3D3D3A">宽：u ≈ 0.15</text><rect x="540" y="272" width="70" height="24" fill="#F3F1EA" rx="12" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="575" y="288.32" font-size="12" fill="#141413" text-anchor="middle">独立复现</text><circle cx="706" cy="284" r="5" fill="#3D3D3A" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><circle cx="722" cy="284" r="5" fill="#3D3D3A" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><circle cx="738" cy="284" r="5" fill="#3D3D3A" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><circle cx="754" cy="284" r="5" fill="#FAF9F5" stroke="#3D3D3A" stroke-width="1.4" class="nt"/><text x="772" y="289" font-size="12.5" fill="#3D3D3A">指定章节</text><line x1="30" y1="325" x2="850" y2="325" stroke="#E8E6DC" stroke-width="1" stroke-linecap="round"/><text x="30" y="356" font-size="13.5" fill="#141413" font-weight="700">预注册过的观察</text><text x="30" y="376" font-size="12" fill="#5E5D59">只在测过的设定上</text><rect x="22