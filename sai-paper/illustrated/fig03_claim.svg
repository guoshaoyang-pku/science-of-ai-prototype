y="-3.8"> 里的每个 ω 给出答案，</tspan></text><text x="486" y="356" font-size="12.5" fill="#5E5D59">D<tspan dy="3.8" font-size="9">M</tspan><tspan dy="-3.8"> 之外声明“不适用”；写明版本。</tspan></text><rect x="470" y="378" width="380" height="76" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="486" y="402" font-size="14.5" fill="#141413" font-weight="700">声明域 D<tspan dy="4.3" font-size="10.44">M</tspan><tspan dy="-4.3"> ⊆ Ω</tspan></text><text x="486" y="424" font-size="12.5" fill="#5E5D59">M 愿意作答的条件集合，</text><text x="486" y="442" font-size="12.5" fill="#5E5D59">以及给出这个集合的依据。</text></svg>
