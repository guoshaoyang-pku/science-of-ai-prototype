<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="SAI 全景：一条主张怎样被描述、评价和记录"><title>SAI 全景：一条主张怎样被描述、评价和记录</title><defs><marker id="fig02-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig02-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig02-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig02-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig02-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig02-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig02-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="639" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">SAI 全景：一条主张怎样被描述、评价和记录</text><text x="32" y="66" font-size="13" fill="#5E5D59">直觉写成主张以后，坐标说它好在哪里，层次说它的边界是怎么知道的；单位是主张，不是论文</text><text x="30" y="100" font-size="13" fill="#5E5D59" font-weight="700">一条主张（基本单位）</text><rect x="30" y="110" width="196" height="112" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="46" y="138" font-size="15" fill="#141413" font-weight="700">问题族 q</text><text x="46" y="162" font-size="12.5" fill="#5E5D59">对每个条件 ω 要预测什么</text><text x="46" y="181" font-size="12.5" fill="#5E5D59">例：两个配置谁的</text><text x="46" y="200" font-size="12.5" fill="#5E5D59">最终验证损失更低</text><rect x="238" y="110" width="196" height="112" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="254" y="138" font-size="15" fill="#141413" font-weight="700">合同 (Ω, μ, ℓ, ε)</text><text x="254" y="162" font-size="12.5" fill="#5E5D59">在哪些条件、按什么权重、</text><text x="254" y="181" font-size="12.5" fill="#5E5D59">怎样算错、容忍多少；</text><text x="254" y="200" font-size="12.5" fill="#5E5D59">真值是把设定跑完的结果</text><rect x="446" y="110" width="196" height="112" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="462" y="138" font-size="15" fill="#141413" font-weight="700">答案规则 M</text><text x="462" y="162" font-size="12.5" fill="#5E5D59">对每个条件给出答案，</text><text x="462" y="181" font-size="12.5" fill="#5E5D59">或声明“不适用”；</text><text x="462" y="200" font-size="12.5" fill="#5E5D59">写明版本</text><rect x="654" y="110" width="196" height="112" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="670" y="138" font-size="15" fill="#141413" font-weight="700">声明域 D<tspan dy="4.5" font-size="10.8">M</tspan><tspan dy="-4.5"> ⊆ Ω</tspan></text><text x="670" y="162" font-size="12.5" fill="#5E5D59">M 愿意作答的条件集合，</text><text x="670" y="181" font-size="12.5" fill="#5E5D59">以及划出这个集合的依据</text><line x1="232" y1="226" x2="232" y2="251" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig02-ar-muted)" class="nt"/><line x1="648" y1="226" x2="648" y2="251" stroke="#5E5D59" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig02-ar-muted)" class="nt"/><rect x="30" y="256" width="404" height="200" fill="#F3F1EA" rx="12" class="card"/><text x="48" y="284" font-size="15" fill="#141413" font-weight="700">三个坐标（0–1，越小越好）</text><text x="48" y="316" font-size="15" fill="#A8492C" font-weight="700">e</text><text x="72" y="316" font-size="13" fill="#141413">误差：声明域里答错的比例</text><text x="48" y="342" font-size="15" fill="#A8492C" font-weight="700">c</text><text x="72" y="342" font-size="13" fill="#141413">代价：相对“直接把训练跑完”（= 1）</text><text x="48" y="368" font-size="15" fill="#A8492C" font-weight="700">u</text><text x="72" y="368" font-size="13" fill="#141413">不适用：M 不作答的条件比例</text><line x1="48" y1="386" x2="416" y2="386" stroke="#DAD6CB" stroke-width="1" stroke-linecap="round"/><circle cx="56" cy="406" r="5.5" fill="#3D3D3A"/><text x="70" y="410" font-size="12.5" fill="#5E5D59">直接训练 ≈ (种子噪声, 1, 0)：处处可用，但最贵</text><circle cx="56" cy="432" r="5.5" fill="#FAF9F5" stroke="#D97757" stroke-width="2.2"/><text x="70" y="436" font-size="12.5" fill="#5E5D59">原点 (0, 0, 0)：理想方向，不是已证结论</text><rect x="446" y="256" width="404" height="200" fill="#F3F1EA" rx="12" class="card"/><text x="464" y="284" font-size="15" fill="#141413" font-weight="700">三层：边界是怎么知道的</text><rect x="464" y="301" width="48" height="24" fill="#3D3D3A" rx="12" class="card"/><text x="488" y="317.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">知识</text><text x="522" y="318" font-size="14" fill="#141413" font-weight="700">观察到</text><text x="574" y="318" font-size="12" fill="#6F6D66">例：GRPO、GSPO</text><text x="522" y="338" font-size="12.5" fill="#5E5D59">只在测过的条件上看到结果，对新条件不作预言</text><rect x="464" y="349" width="48" height="24" fill="#3D3D3A" rx="12" class="card"/><text x="488" y="365.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">定律</text><text x="522" y="366" font-size="14" fill="#141413" font-weight="700">测出来</text><text x="574" y="366" font-size="12" fill="#6F6D66">例：scaling law</text><text x="522" y="386" font-size="12.5" fill="#5E5D59">沿条件轴系统扩展，由观测到的失败定界</text><rect x="464" y="397" width="48" height="24" fill="#3D3D3A" rx="12" class="card"/><text x="488" y="413.68" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">科学</text><text x="522" y="414" font-size="14" fill="#141413" font-weight="700">推出来</text><text x="574" y="414" font-size="12" fill="#6F6D66">例：Hyperball</text><text x="522" y="434" font-size="12.5" fill="#5E5D59">从可独立检验的前提推出关系和边界</text><text x="440" y="482" font-size="12.5" fill="#6F6D66" text-anchor="middle">坐标相对一份合同，层次看依据的类型：两者都记，不互相推出</text><text x="30" y="512" font-size="13" fill="#5E5D59" font-weight="700">另外分开记录</text><text x="654" y="512" font-size="13" fill="#5E5D59" font-weight="700">派生概念</text><rect x="30" y="522" width="196" height="100" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="46" y="548" font-size="15" fill="#141413" font-weight="700">Scope</text><text x="46" y="570" font-size="12.5" fill="#5E5D59">适用范围多大：</text><text x="46" y="589" font-size="12.5" fill="#5E5D59">合同下的 u 及其上界</text><rect x="238" y="522" width="196" height="100" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="254" y="548" font-size="15" fill="#141413" font-weight="700">证据协议</text><text x="254" y="570" font-size="12.5" fill="#5E5D59">坐标多可信：</text><text x="254" y="589" font-size="12.5" fill="#5E5D59">预注册、盲测、新鲜题、</text><text x="254" y="608" font-size="12.5" fill="#5E5D59">程序裁决、复现、证明核查</text><rect x="446" y="522" width="196" height="100" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="462" y="548" font-size="15" fill="#141413" font-weight="700">阅读层级</text><text x="462" y="570" font-size="12.5" fill="#5E5D59">我们读到多深：</text><text x="462" y="589" font-size="12.5" fill="#5E5D59">元数据 → 摘要 →</text><text x="462" y="608" font-size="12.5" fill="#5E5D59">指定章节 → 全文</text><rect x="654" y="522" width="196" height="100" fill="#FFFFFF" rx="10" stroke="#D97757" stroke-width="1.6" class="card"/><text x="670" y="548" font-size="15" fill="#141413" font-weight="700">SAI 系统</text><text x="670" y="570" font-size="12.5" fill="#5E5D59">自动产出主张的系统；</text><text x="670" y="589" font-size="12.5" fill="#5E5D59">看前沿推进、生产代价</text><text x="670" y="608" font-size="12.5" fill="#5E5D59">和划界诚实度</text></svg>
