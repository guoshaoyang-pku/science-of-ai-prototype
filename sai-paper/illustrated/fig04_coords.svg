="3"/><rect x="284" y="388" width="28" height="28" fill="#EFC1A8" rx="3"/><rect x="316" y="388" width="28" height="28" fill="#EFC1A8" rx="3"/><rect x="348" y="388" width="28" height="28" fill="#EFC1A8" rx="3"/><path d="M186 98L218 98M218 98L218 130M186 418L218 418M218 130L250 130M250 130L250 162M314 418L346 418M378 354L378 386M58 258L58 290M58 322L58 354M58 98L90 98M58 98L58 130M58 418L90 418M58 386L58 418M58 162L58 194M218 418L250 418M346 322L378 322M378 322L378 354M282 418L314 418M250 162L250 194M346 418L378 418M378 386L378 418M346 290L346 322M90 98L122 98M90 418L122 418M282 226L314 226M314 226L314 258M154 98L186 98M154 418L186 418M58 226L58 258M58 290L58 322M250 194L282 194M282 194L282 226M58 354L58 386M314 258L346 258M346 258L346 290M58 130L58 162M58 194L58 226M122 98L154 98M122 418L154 418M250 418L282 418" fill="none" stroke="#D97757" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="nt"/><rect x="60" y="436" width="16" height="14" fill="#EFC1A8" rx="2"/><text x="82" y="447" font-size="12.5" fill="#3D3D3A">作答且在 ε 内：72 格</text><rect x="222.75" y="436" width="16" height="14" fill="#A3291F" rx="2"/><path d="M227.15 439.4L234.35 446.6M234.35 439.4L227.15 446.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nt"/><text x="244.75" y="447" font-size="12.5" fill="#3D3D3A">作答但超出 ε：8 格</text><rect x="373.5" y="436" width="16" height="14" fill="url(#fig04-hatch)" rx="2" stroke="#DAD6CB" stroke-width="1"/><text x="395.5" y="447" font-size="12.5" fill="#3D3D3A">声明不作答：20 格</text><rect x="404" y="100" width="446" height="190" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="424" y="132" font-size="18" fill="#A8492C" font-weight="700">e</text><text x="452" y="132" font-size="13.5" fill="#141413">= 声明域里答错的格 ÷ 声明域的格</text><text x="452" y="154" font-size="13.5" fill="#141413" font-weight="700">= 8 ÷ 80 = 0.10</text><text x="424" y="192" font-size="18" fill="#A8492C" font-weight="700">c</text><text x="452" y="192" font-size="13.5" fill="#141413">= 声明域里每次作答的平均代价</text><text x="452" y="214" font-size="13.5" fill="#141413" font-weight="700">= 0.05（直接训练 = 1）</text><text x="424" y="252" font-size="18" fill="#A8492C" font-weight="700">u</text><text x="452" y="252" font-size="13.5" fill="#141413">= 不作答的格 ÷ 全部的格</text><text x="452" y="274" font-size="13.5" fill="#141413" font-weight="700">= 20 ÷ 100 = 0.20</text><rect x="404" y="302" width="446" height="118" fill="#FFFFFF" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><rect x="404" y="302" width="5" height="118" fill="#D97757" rx="2"/><text x="424" y="328" font-size="14" fill="#141413" font-weight="700">回退：不作答的 20 格改为直接训练</text><text x="424" y="354" font-size="13.5" fill="#141413">e′ = (1 − u) · e = 0.8 × 0.10 = 0.08</text><text x="424" y="378" font-size="13.5" fill="#141413">c′ = (1 − u) · c + u = 0.8 × 0.05 + 0.2 = 0.24</text><text x="424" y="402" font-size="13.5" fill="#141413">u′ = 0</text></svg>
