<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="三轴空间：科学的方向，是用更少的试探得到同样的答案"><title>三轴空间：科学的方向，是用更少的试探得到同样的答案</title><defs><marker id="fig05-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig05-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig05-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig05-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig05-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig05-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig05-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="559" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">三轴空间：科学的方向，是用更少的试探得到同样的答案</text><line x1="110" y1="490" x2="530" y2="490" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="110" y1="490" x2="110" y2="240" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="720" y1="350" x2="530" y2="490" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="720" y1="350" x2="720" y2="100" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="530" y1="490" x2="530" y2="240" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="300" y1="100" x2="110" y2="240" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="300" y1="100" x2="720" y2="100" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="110" y1="240" x2="530" y2="240" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="720" y1="100" x2="530" y2="240" stroke="#DFDBD0" stroke-width="1" stroke-linecap="round" class="nt"/><line x1="300" y1="350" x2="300" y2="70" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig05-ar-ink)" class="nt"/><line x1="300" y1="350" x2="770.4" y2="350" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig05-ar-ink)" class="nt"/><line x1="300" y1="350" x2="87.2" y2="506.8" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fig05-ar-ink)" class="nt"/><text x="288" y="80" font-size="14.5" fill="#141413" font-weight="700" text-anchor="end">误差 e</text><text x="288" y="98" font-size="12" fill="#5E5D59" text-anchor="end">错得少（0–1）</text><text x="782" y="354" font-size="14.5" fill="#141413" font-weight="700">代价 c</text><text x="782" y="372" font-size="12" fill="#5E5D59">直接训练 = 1</text><text x="104" y="516" font-size="14.5" fill="#141413" font-weight="700">不适用 u（0–1）</text><text x="104" y="534" font-size="12" fill="#5E5D59">管得宽：越小越宽</text><path d="M708 337 Q510 296 318 341" fill="none" stroke="#D97757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fig05-ar-clay)" class="nt"/><text x="513" y="296" font-size="14" fill="#A8492C" font-weight="700" text-anchor="middle">科学：用更少的试探，得到同样的答案</text><circle cx="720" cy="345" r="7" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="2" class="nt"/><text x="692" y="392" font-size="14" fill="#141413" font-weight="700">直接训练</text><text x="692" y="410" font-size="12" fill="#5E5D59">处处可用，误差只来自种子噪声</text><text x="692" y="428" font-size="12" fill="#5E5D59">但最贵：c = 1</text><circle cx="300" cy="350" r="7.5" fill="#FAF9F5" stroke="#D97757" stroke-width="2.4" class="nt"/><circle cx="300" cy="350" r="3" fill="#D97757" class="nt"/><text x="286" y="326" font-size="14" fill="#A8492C" font-weight="700" text-anchor="end">原点 (0, 0, 0)：万物理论</text><text x="286" y="344" font-size="12" fill="#5E5D59" text-anchor="end">理想方向，不是已证结论</text><circle cx="316.8" cy="275" r="6.5" fill="#2E6CAB" stroke="#FAF9F5" stroke-width="2" class="nt"/><text x="296" y="270" font-size="13" fill="#141413" font-weight="700" text-anchor="end">U：代价近 0、误差大于 0</text><text x="296" y="288" font-size="12" fill="#5E5D59" text-anchor="end">便宜但不精确的候选规律</text><circle cx="140.5" cy="478" r="6" fill="#4A6328" stroke="#FAF9F5" stroke-width="2" class="nt"/><line x1="148.5" y1="474" x2="171" y2="466" stroke="#6F6D66" stroke-width="1" stroke-linecap="round"/><text x="176" y="462" font-size="13" fill="#141413" font-weight="700">只测过少数设定的知识</text><text x="176" y="479" font-size="12" fill="#5E5D59">u 接近 1：未测的设定记为未知</text><rect x="636" y="446" width="224" height="82" fill="#F3F1EA" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="650" y="470" font-size="12" fill="#3D3D3A" font-weight="700">三个坐标都相对同一份合同</text><text x="650" y="490" font-size="12" fill="#5E5D59">(Ω, μ, ℓ, ε)。换了 μ，u 会变；</text><text x="650" y="510" font-size="12" fill="#5E5D59">比较两条主张须用同一份合同。</text></svg>
