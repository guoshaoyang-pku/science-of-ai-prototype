<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" role="img" aria-label="衡量直觉：等价算力 ρ^* 把误差折算成代价"><title>衡量直觉：等价算力 ρ^* 把误差折算成代价</title><defs><marker id="fig07-ar-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3D3D3A"/></marker><marker id="fig07-ar-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5E5D59"/></marker><marker id="fig07-ar-clay" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97757"/></marker><marker id="fig07-ar-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2E6CAB"/></marker><marker id="fig07-ar-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#A3291F"/></marker><pattern id="fig07-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D6D2C7" stroke-width="2.2"/></pattern><pattern id="fig07-hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1D9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E2C070" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="879" height="429" rx="14" fill="#FAF9F5" stroke="#E6E3DA"/><text x="32" y="42" font-size="19" fill="#141413" font-weight="700">衡量直觉：等价算力 ρ<tspan dy="-7.6" font-size="13.68">*</tspan><tspan dy="7.6"> 把误差折算成代价</tspan></text><text x="32" y="66" font-size="13" fill="#5E5D59">示意图。先在一份合同下测直觉（例如不训练、闭卷判断的模型）的选对率，再看基线试探要花多少预算才能追平</text><line x1="110" y1="360" x2="612" y2="360" stroke="#3D3D3A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fig07-ar-ink)" class="nt"/><line x1="110" y1="360" x2="110" y2="100" stroke="#3D3D3A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fig07-ar-ink)" class="nt"/><text x="120" y="104" font-size="12.5" fill="#5E5D59" font-weight="700">选对率</text><text x="600" y="404" font-size="12.5" fill="#5E5D59" text-anchor="end">试探预算（占每个候选完整训练的比例）</text><text x="110" y="380" font-size="12" fill="#5E5D59" text-anchor="middle">0</text><path d="M110 360L114.08 355.33L118.17 350.76L122.25 346.27L126.33 341.88L130.42 337.57L134.5 333.35L138.58 329.21L142.67 325.15L146.75 321.17L150.83 317.27L154.92 313.45L159 309.71L163.08 306.03L167.17 302.43L171.25 298.91L175.33 295.45L179.42 292.06L183.5 288.74L187.58 285.48L191.67 282.29L195.75 279.16L199.83 276.09L203.92 273.09L208 270.14L212.08 267.25L216.17 264.42L220.25 261.65L224.33 258.93L228.42 256.26L232.5 253.65L236.58 251.09L240.67 248.58L244.75 246.11L248.83 243.7L252.92 241.34L257 239.02L261.08 236.75L265.17 234.52L269.25 232.34L273.33 230.2L277.42 228.1L281.5 226.05L285.58 224.03L289.67 222.06L293.75 220.12L297.83 218.22L301.92 216.36L306 214.54L310.08 212.75L314.17 211L318.25 209.28L322.33 207.6L326.42 205.95L330.5 204.33L334.58 202.75L338.67 201.19L342.75 199.67L346.83 198.18L350.92 196.72L355 195.28L359.08 193.88L363.17 192.5L367.25 191.15L371.33 189.82L375.42 188.53L379.5 187.25L383.58 186.01L387.67 184.78L391.75 183.59L395.83 182.41L399.92 181.26L404 180.13L408.08 179.03L412.17 177.94L416.25 176.88L420.33 175.84L424.42 174.82L428.5 173.82L432.58 172.84L436.67 171.88L440.75 170.93L444.83 170.01L448.92 169.1L453 168.22L457.08 167.35L461.17 166.49L465.25 165.66L469.33 164.84L473.42 164.04L477.5 163.25L481.58 162.48L485.67 161.72L489.75 160.98L493.83 160.25L497.92 159.54L502 158.84L506.08 158.16L510.17 157.49L514.25 156.83L518.33 156.19L522.42 155.55L526.5 154.94L530.58 154.33L534.67 153.73L538.75 153.15L542.83 152.58L546.92 152.02L551 151.47L555.08 150.93L559.17 150.4L563.25 149.89L567.33 149.38L571.42 148.88L575.5 148.4L579.58 147.92L583.67 147.45L587.75 146.99L591.83 146.54L595.92 146.1L600 145.67" fill="none" stroke="#D97757" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="nt"/><line x1="110" y1="167.14" x2="458.05" y2="167.14" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" class="nt"/><line x1="458.05" y1="167.14" x2="458.05" y2="360" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" class="nt"/><circle cx="458.05" cy="167.14" r="5.5" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="2" class="nt"/><text x="458.05" y="382" font-size="15" fill="#141413" font-weight="700" text-anchor="middle">ρ<tspan dy="-6" font-size="10.8">*</tspan></text><text x="122" y="158" font-size="12.5" fill="#141413">直觉的选对率（不训练，闭卷判断）</text><text x="250" y="270" font-size="12.5" fill="#3D3D3A">基线试探：预算越多，选得越准</text><rect x="640" y="108" width="216" height="194" fill="#F3F1EA" rx="10" stroke="#DAD6CB" stroke-width="1" class="card"/><text x="656" y="134" font-size="14" fill="#141413" font-weight="700">怎么读</text><text x="656" y="160" font-size="12.5" fill="#5E5D59">直觉越准，水平线越高，</text><text x="656" y="180" font-size="12.5" fill="#5E5D59">追平它要花的预算 ρ<tspan dy="-5" font-size="9">*</tspan><tspan dy="5"> 越大。</tspan></text><text x="656" y="200" font-size="12.5" fill="#5E5D59">ρ<tspan dy="-5" font-size="9">*</tspan><tspan dy="5"> 是目前唯一定量的判据：</tspan></text><text x="656" y="220" font-size="12.5" fill="#5E5D59">它把误差换算成代价，</text><text x="656" y="240" font-size="12.5" fill="#5E5D59">是三轴的一个切片。</text><text x="656" y="260" font-size="12.5" fill="#5E5D59">panel 的合同取</text><text x="656" y="280" font-size="12.5" fill="#5E5D59">ArchitectureIQ。</text></svg>
